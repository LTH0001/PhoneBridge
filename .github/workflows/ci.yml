name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -c constraints-windows-py313.txt
      - name: Python unit tests (no hardware)
        run: python -m unittest discover -s tests -v
      - name: Java gesture tests
        shell: powershell
        run: ./scripts/check-panel-gestures.ps1
      - name: Public source audit
        run: python scripts/audit-source.py
